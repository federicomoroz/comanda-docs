  <g style="animation: h14 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">1</text><text x="160" y="134" class="step-title">El mozo carga y envía</text><text x="160" y="170" class="body">Una tablet por mozo, en el Wi‑Fi del local. Lo que carga queda en la cuenta de la</text><text x="160" y="197" class="body">mesa hasta que lo envía.</text></g><g style="animation: h15 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">2</text><text x="160" y="134" class="step-title">Una comanda por estación</text><text x="160" y="170" class="body">Cada estación recibe solo lo suyo, numerado en el día: en pantalla y, si tiene</text><text x="160" y="197" class="body">impresora, también en papel.</text></g><g style="animation: h16 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">3</text><text x="160" y="134" class="step-title">Listo, y el mozo se entera</text><text x="160" y="170" class="body">La cocina marca listo y la tablet del mozo lo muestra en el momento, sin recargar</text><text x="160" y="197" class="body">la pantalla.</text></g><g style="animation: h17 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">4</text><text x="160" y="134" class="step-title">La caja cobra</text><text x="160" y="170" class="body">Pagos divididos entre efectivo, tarjeta y QR, con propina y vuelto. Al cerrar el</text><text x="160" y="197" class="body">turno, el arqueo compara lo esperado con lo contado.</text></g><g style="animation: h18 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">5</text><text x="160" y="134" class="step-title">Factura, sin hacer esperar</text><text x="160" y="170" class="body">La caja pide la factura y sigue con la próxima mesa. Facturación la manda a ARCA</text><text x="160" y="197" class="body">desde su propia cola.</text></g><g style="animation: h19 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">6</text><text x="160" y="134" class="step-title">CAE y QR, de vuelta en la caja</text><text x="160" y="170" class="body">Factura B autorizada, con el QR de ARCA. En esta versión ARCA está simulado y la</text><text x="160" y="197" class="body">factura se imprime como «sin validez fiscal».</text></g>
