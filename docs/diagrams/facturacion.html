  <g style="animation: h14 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">1</text><text x="160" y="134" class="step-title">Se guarda primero</text><text x="160" y="170" class="body">El pedido de factura entra al outbox en la misma transacción que la cuenta. Si</text><text x="160" y="197" class="body">algo falla después, el pedido ya está guardado.</text></g><g style="animation: h15 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">2</text><text x="160" y="134" class="step-title">Facturación no responde</text><text x="160" y="170" class="body">La caja muestra «Esperando a Facturación» y el motivo. El cajero no vuelve a</text><text x="160" y="197" class="body">cargar nada: el pedido espera en el outbox.</text></g><g style="animation: h16 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">3</text><text x="160" y="134" class="step-title">Vuelve, y sale solo</text><text x="160" y="170" class="body">Medido con las imágenes de producción: el pedido salió solo 14 segundos después de</text><text x="160" y="197" class="body">que Facturación volvió.</text></g><g style="animation: h17 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">4</text><text x="160" y="134" class="step-title">ARCA caída</text><text x="160" y="170" class="body">La factura espera en la cola de Facturación, en orden, para que la numeración siga</text><text x="160" y="197" class="body">correlativa. Cada reintento llega más espaciado.</text></g><g style="animation: h18 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">5</text><text x="160" y="134" class="step-title">ARCA vuelve: CAE</text><text x="160" y="170" class="body">La cola sigue sola desde la primera factura pendiente. Nadie tiene que reintentar</text><text x="160" y="197" class="body">a mano.</text></g><g style="animation: h19 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">6</text><text x="160" y="134" class="step-title">El estado vuelve a Comanda</text><text x="160" y="170" class="body">Cada cambio viaja con un número de versión: si uno viejo llega tarde, no pisa al</text><text x="160" y="197" class="body">nuevo. Con Comanda caída, espera en el outbox de Facturación.</text></g>
